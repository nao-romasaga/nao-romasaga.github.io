    <script>
        console.log(WEAPON_DATA);
        let weapon_rank = {};
        for(i in WEAPON_DATA) {
            WEAPON_DATA[i]["SSS"].sort((a, b) => b.Power - a.Power);
            weapon_rank[i] = WEAPON_DATA[i]["SSS"].filter(x => {
                return ["(光)アビススタッフ","(火)アビススタッフ","(水)アビススタッフ","(土)アビススタッフ","(風)アビススタッフ","(光)ネビュラワンド","(火)ネビュラワンド","(水)ネビュラワンド","(土)ネビュラワンド","(風)ネビュラワンド"].indexOf(x['Name']) == -1
            });            
            weapon_rank[i] = weapon_rank[i].slice(0,5);
        }
        for(i in ARMOR_CHOICE) {
            ARMOR_CHOICE[i].sort((a, b) => b.Power - a.Power);
            weapon_rank[i] = ARMOR_CHOICE[i].filter(
                x => {
                    return ["名将の鎧(US)","名将の鎧(ES&IS)","名将の鎧(SSG)","名将の鎧(SaGaEB)","名将の鎧(SaGaRS&その他)","名将の鎧(GBSaGa)","名将の鎧(SF1)","名将の鎧(SF2)","双華のブローチ(＋)","豪傑のモノクル(＋)","炎翼のイヤリング(＋)","白牙のピアス(＋)","冥淵のタリスマン(＋)"].indexOf(x['Name']) == -1
                }
            );
        }       
        
        let armor_power = [];
        let font_size = [1.2,1.1,1,0.9,0.8];
        for(i = 0; i < 5; i++) {
            armor_power.push({
                "MAIN":weapon_rank["MAIN"][i],
                "SUB":weapon_rank["SUB"][i],
                "ACC":weapon_rank["ACC"][0],
            })
            for(type of ["MAIN","SUB","ACC"]) {
                addRankingRow(weapon_rank[type][i], type, false);
            }
        }
        


        function addRankingRow(eq_data, type, isWeapon){
            prefix = (type == "ACC") ? "accessory_": "armor_";
            prefix = (isWeapon) ? "" : prefix;
            illustKey = (isWeapon) ? "Illust" : "illust";
            rare = (isWeapon) ? "SSS" : eq_data['Rarity'];
            illustName = prefix + ((eq_data[illustKey] == undefined) ? rare.toLowerCase(): eq_data[illustKey]);
            $tmpl = $(".ARMOR_TEMPLATE").clone().removeClass("d-none ARMOR_TEMPLATE").addClass("d-flex");
            $tmpl.find(`.CROWN${i+1}`).removeClass("d-none");
            $tmpl.find(".RANK").append((i+1)).attr("style", `font-size:${font_size[i]}em;`);
            $tmpl.find(".ICON").append(getWeaponIcon(rare, illustName, ""));
            $tmpl.find(".NAME").append(eq_data['Name']);
            $tmpl.find(".POWER").append(eq_data['Power']);
            let drop = eq_data['drop'];
            drop = drop.indexOf("ロマンシングメダル") > -1 ? "ロマンシングメダル交換所" : drop;
            $tmpl.find(".DROP").append(drop);
            $("." + type).append($tmpl.clone());
        }

        console.log(armor_power);
        for(wp_jp in MASTER_LV_KEY) {
            let clz = wp_jp == "剣" ? "d-none" : "";
            $tmpl = $(".WP_TMPL").clone().removeClass(`${clz} WP_TMPL`);
            $tmpl.find(".WP_NAME").removeClass("WP_NAME").append(wp_jp);
            $tmpl.find(".WP_CLASS_NAME").removeClass("WP_NAME").addClass(`${wp_jp}`);
            $tmpl.addClass(`${MASTER_LV_KEY[wp_jp]} wpRow`);
            $(".WP_BASE").append($tmpl);
            for(i = 0; i < 5; i++) {
                addRankingRow(weapon_rank[wp_jp][i], wp_jp, true);
            }
        }

        let shonoList = new Set();

        createRanking();

        $(".fwButton").click(function () {
            $(".wpRow").addClass("d-none");
            $(".fwButton").each(function(){
                $(this).removeClass("filterActive");
            });
            $(this).toggleClass("filterActive");
            let id = $(this).attr("data-id");
            $(`.wpRow.${MASTER_LV_KEY[id]}`).removeClass("d-none");
        });

        $(".fButton").click(function () {
            $(this).toggleClass("filterActive");
            const ids = $(this).parent(".filterList").data("href").split("_"); // data-hrefを分割
            ids.forEach(id => {
                if ($(this).hasClass("filterActive")) {
                    shonoList.add(id); // 各idを追加
                } else {
                    shonoList.delete(id); // 各idを削除
                }
            });
            createRanking();
        });

        function createRanking(){
            $("#STYLE_RANKING").html("");
            $("#NOW_STYLE_RANKING").html("");
            $("#GUILD_RANKING").html("");
            
            let master = [];
            for (let i in STYLE_MASTER) {
                let valueMap = CONST_STYLE_BONUS_VAL[STYLE_MASTER[i]['Rarity']];
                let tmpSt = {}
                for (let p of PARAM_KEY) {
                    tmpSt[p] = 0;
                }
                for (let lv in valueMap) {
                    let name = STYLE_MASTER[i]["StyleBonus"][lv];
                    if (name === "全能力値") {
                        for (let p of PARAM_KEY) {
                            tmpSt[p] += valueMap[lv];
                        }
                    } else {
                        tmpSt[PARAM_KEY[PARAM_NAME.indexOf(name)]] += valueMap[lv];
                    }
                }
                let id = STYLE_MASTER[i]['Id'];
                let charId = STYLE_MASTER[id]['CharacterId'];
                let charInfo = CHAR_MASTER[charId];

                const shonoHP = shonoList.has(charInfo['Series'])? 440 : 0;
                const shonoPer = shonoList.has(charInfo['Series'])? 16 : 0;

                var rarePath =  getImgPath(`icon/icon_${STYLE_MASTER[i]['Rarity']}.png`);
                var wpPath =  getImgPath(`icon/${ICON_LIST[STYLE_MASTER[i]['WeaponType']]}.png`);
                var stylePath =  getImgPath(`style_icon/${STYLE_MASTER[i]['IllustId']}.png`);

                var limsum = 0, valsum = 0, totalPer = 0;
                //var POWER_TABLE = {"STR":6,"VIT":6, "DEX":4, "AGI":4,"INT":4,"MND":4,"AI":2,"MI":2}
                var power = 0;
                for (var key of ["Zan","Da","Totsu","Netsu","Rei","Rai","Inn",'You']){
                    power += STYLE_MASTER[i][`Resist${key}`];
                }
                for (let key of PARAM_KEY) {
                    var tmpPer = STYLE_MASTER[i]["StyleBonusLv50" + key];
                    totalPer += tmpPer;
                    let st = (charInfo["MAX" + key] === -99) ? "?" : OVER_LIMIT_POWER + charInfo["MAX" + key] + charInfo[key];
                    var calcSt = st + (st * (tmpPer + SHODAN + DAI_SEI_PER + shonoPer) / 100 ) + tmpSt[key] + URA;
                    STYLE_MASTER[i]["CharSt"+key] = st;
                    STYLE_MASTER[i]["StyleSt"+key] = calcSt;
                    STYLE_MASTER[i]["StylePer"+key] = tmpPer + SHODAN + DAI_SEI_PER;
                    STYLE_MASTER[i]["StyleBonus"+key] = (tmpSt[key]+ URA) + " + "+DAI_SEI_VAL;
                    power += POWER_TABLE[key] * calcSt;
                    power += (POWER_TABLE[key] / 2) * DAI_SEI_VAL;
                }
                
                STYLE_MASTER[i]["Power"] = Math.floor(power + (HP_LIMIT_POWER + URA_HP + DAI_SEI_HP + shonoHP) * 5 );
                master.push(STYLE_MASTER[i]);
            }
            master.sort((a, b) => b.Power - a.Power);
            console.log(master);
            let gachaList = getOpenGacha();
            let nowStyleList = [];
            for(i in master) {
                let styleInfo = master[i];
                for(g of gachaList) {
                    if(styleInfo['gacha'] == g) {
                        styleInfo['RANK'] = (Number(i)+1);
                        nowStyleList.push(styleInfo);
                        break;
                    }
                }
            }

            masterSlice = master.slice(0,20);

            let guild = [];
            let guildData = [];
            let seriesList = {'RS1':0,'RS2':0,'RS3':0,'SF1':0,'SF2':0,'US':0,'ES_IS':0,'SSG':0,'SEB':0,'GB1_GB2_GB3':0,'RSR_OTR':0}
            for(i in masterSlice){
                let styleInfo = masterSlice[i];
                if(guild.indexOf(styleInfo['CharacterId']) == -1
                    && guild.length < 5) {
                    guild.push(styleInfo['CharacterId']);
                    guildData.push(styleInfo);
                }
                let charId = styleInfo['CharacterId'];
                let charInfo = CHAR_MASTER[charId];
                let series = charInfo['Series'];
                if(["ES","IS"].indexOf(series) >-1){
                    series = "ES_IS";
                } else if(["GB1","GB2","GB3"].indexOf(series) >-1){
                    series = "GB1_GB2_GB3";
                } else if(["RSR","OTR"].indexOf(series) >-1){
                    series = "RSR_OTR";
                }                
                seriesList[series]++;
                
                $tmpl = $(".STYLE_TEMPLATE").clone().removeClass(`STYLE_TEMPLATE d-none`);

                let icon = getStyleIcon(styleInfo['Rarity'], styleInfo['Id'], styleInfo['WeaponType']).clone();
                icon.find(".CHECK_COVER").remove();
                $tmpl.find(".STYLE_ICON").append(icon);
                $tmpl.find(".STYLE_POWER").append(styleInfo["Power"].toLocaleString());
                $tmpl.find(".STYLE_NAME").append(`${styleInfo["Name"]} ${styleInfo["AnotherName"]}`);
                
                for (let key of PARAM_KEY) {
                    let base = styleInfo[`CharSt${key}`];
                    let styleVal = Math.floor(styleInfo[`StyleSt${key}`]);
                    let stylePer = styleInfo[`StylePer${key}`];
                    let bonus = styleInfo[`StyleBonus${key}`];
                    $tmpl.find(`.${key}`).append(`${styleVal}`);
                    //$tmpl.find(`.${key}`).append(`${styleVal}<br>${base} * ${stylePer}% + ${bonus}`);
                    $tmpl.find(`.${key}_BASE`).append(`${base}`);
                }
                $("#STYLE_RANKING").append($tmpl);
            };
            console.log(seriesList);
            for(series in seriesList){
                $("#VAL_"+series).html(seriesList[series]);
            }
            for(gacha of gachaList){
                $("#NOW_STYLE_RANKING").append(gacha);
                for(i in master){
                    let styleInfo = master[i];
                    if(styleInfo['gacha'] != gacha) {
                        continue;
                    }
                    $tmpl = $(".STYLE_TEMPLATE3").clone().removeClass(`STYLE_TEMPLATE3 d-none`);

                    let icon = getStyleIcon(styleInfo['Rarity'], styleInfo['Id'], styleInfo['WeaponType']).clone();
                    icon.find(".CHECK_COVER").remove();
                    $tmpl.find(".STYLE_ICON").append(icon);
                    $tmpl.find(".STYLE_POWER").append(styleInfo["Power"].toLocaleString());
                    $tmpl.find(".STYLE_RANK").append(`${styleInfo["RANK"]}`);
                    $tmpl.find(".STYLE_NAME").append(`${styleInfo["Name"]} ${styleInfo["AnotherName"]}`);
                    console.log(styleInfo);
                    let sum = 0;
                    for (let key of PARAM_KEY) {
                        let stylePer = styleInfo[`StyleBonusLv50${key}`];
                        sum += stylePer;
                        $tmpl.find(`.${key}`).append(`${stylePer}%`);
                    }
                    $tmpl.find(`.SUM`).append(`${sum}%`);
                    $("#NOW_STYLE_RANKING").append($tmpl);
                };      
            }      
            

            let total_power = 0;
            let rank4wp = {};
            for(i in guildData){
                let styleInfo = guildData[i];

                rank4wp[styleInfo["WeaponType"]] = rank4wp[styleInfo["WeaponType"]] ?? 0;
                let wp = weapon_rank[styleInfo["WeaponType"]][rank4wp[styleInfo["WeaponType"]]];
                rank4wp[styleInfo["WeaponType"]]++;

                $tmpl = $(".STYLE_TEMPLATE2").clone().removeClass(`STYLE_TEMPLATE2 d-none`);

                let icon = getStyleIcon(styleInfo['Rarity'], styleInfo['Id'], styleInfo['WeaponType']).clone();
                icon.find(".CHECK_COVER").remove();
                $tmpl.find(".STYLE_ICON").append(icon);

                $tmpl.find(".STYLE_NAME").append(`${styleInfo["Name"]} ${styleInfo["AnotherName"]}`);
                $tmpl.find(".STYLE_NAME2").append(styleInfo["Name"]);
                $tmpl.find(".STYLE_ANOTHER").append(styleInfo["AnotherName"]);

                $tmpl.find(`.G_WEAPON`).append(getWeaponIcon("SSS", wp["Illust"], ""));
                $tmpl.find(`.EQ_NAME_WEAPON`).append(wp["Name"]);

                let power = wp["Power"];
                for(type of ["MAIN","SUB","ACC"]){
                    prefix = (type == "ACC") ? "accessory_": "armor_";
                    illustName = (type == "WEAPON") ? "" : prefix+armor_power[i][type]["illust"];
                    $tmpl.find(`.G_${type}`).append(getWeaponIcon(armor_power[i][type]['Rarity'], illustName, ""));
                    $tmpl.find(`.EQ_NAME_${type}`).append(armor_power[i][type]["Name"]);
                    power += armor_power[i][type]['Power'];
                }
                total_p = styleInfo["Power"] + power;
                total_power += total_p;

                $tmpl.find(".STYLE_POWER").append((total_p).toLocaleString());
                $tmpl.find(".STYLE_POWER1").append(styleInfo["Power"].toLocaleString());
                $tmpl.find(".STYLE_POWER2").append("+"+power.toLocaleString());

                $("#GUILD_RANKING").append($tmpl);
            };
            $(".TOTAL_POWER").html(total_power.toLocaleString());
        }
        function getSmallIcon(styleInfo) {
            let styleImg = getImgPath(`style_icon/${styleInfo['Id']}.webp`);
            // スタイルアイコンの追加
            let icon = $("<button>")
                .addClass(getStyleIconClass(styleInfo['Rarity']) + "_small")
                .attr("style", `background:url(${styleImg}) no-repeat;`)
            let background = $("<span>").addClass(getStyleIconBgClass(styleInfo['Rarity']))
                .attr("style", "height: 30px;")
                .append(icon);
            return background;
        }
    </script>
